---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bgg-app
  template:
    metadata:
      labels:
        app: bgg-app
    spec:
      containers:
      - name: bggapp-container
        image: stackupiss/bgg-backend:v1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: bggapp-port
          failureThreshold: 3
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 30
        envFrom:
        - configMapRef:
            name: bgginfo-cm
        - secretRef:
            name: bgg-db-password
        ports:
        - name: bggapp-port
          containerPort: 3000
        resources: {}
        #env:
        #- name: BGG_DB_USER
        #  value: "root"
        #- name: BGG_DB_HOST
        #  value: "bggdb-svc.bggns.svc.cluster.local"

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  type: ClusterIP
  selector:
    app: bgg-app
  ports:
  - port: 3000
    targetPort: bggapp-port