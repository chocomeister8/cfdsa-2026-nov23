---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umamidb-pvc
  namespace: workshop03
spec:
  storageClassName: standard
  accessModes:
  - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamidb-deploy
  namespace: workshop03
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: umamidb
  template:
    metadata:
      labels:
        app: umamidb
    spec:
      volumes:
      - name: umamidb-vol
        persistentVolumeClaim:
          claimName: umamidb-pvc
      containers:
      - name: umamidb-container
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: umami-cm
        - secretRef:
            name: umamidb-secret
        ports:
        - name: db-port
          containerPort: 5432
        volumeMounts:
        - name: umamidb-vol
          mountPath: /var/lib/postgresql/data

---
apiVersion: v1
kind: Service
metadata:
  name: umamidb-svc
  namespace: workshop03
spec:
  type: ClusterIP
  selector:
    app: umamidb
  ports:
  - port: 5432
    targetPort: db-port