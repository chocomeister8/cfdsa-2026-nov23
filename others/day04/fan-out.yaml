---
apiVersion: v1
kind: Namespace
metadata:
  name: day04

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-httproute
  namespace: day04
spec:
  hostnames:
  - api.172.25.0.4.nip.io
  parentRefs:
  - name: default-gtw
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          # /v1/api/data -> /api/data
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: api-svc
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    backendRefs:
    - name: api2-svc
      port: 3000