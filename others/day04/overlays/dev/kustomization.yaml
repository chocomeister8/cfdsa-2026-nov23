---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- httproute.yaml

configurations:
- transform.yaml

namespace: dev
namePrefix: dev-
labels:
- pairs:
    env: dev
  includeSelectors: true
  includeTemplates: true
replicas:
- name: dov-deploy
  count: 1
images:
- name: chukmunnlee/dov-bear
  newTag: v2

configMapGenerator:
- name: dov-cm
  literals:
  - INSTANCE_NAME: 'my-dov-bear'

patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: dov-deploy
  path: 