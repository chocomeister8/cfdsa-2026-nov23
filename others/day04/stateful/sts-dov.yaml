--- 
apiVersion: v1 
kind: Service
metadata:
  name: sts-dov
  namespace: day04
spec:
  clusterIp: None
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: http-port

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-dov
  namespace: day04
spec:
  serviceName: sts-dov-hsvc
  replicas: 3
  strategy:
    type: Recreate
    #type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 20%
    #   maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: dov-container 
        image: chukmunnlee/dov-bear:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: INSTANCE_NAME
          valueFrom:
            fieldRef:
              fieldPatch: spec.nodeName
        - name: INSTANCE_HASH
          valueFrom:
            fieldRef:
              fieldPatch:
        ports:
        - name: http-port
          containerPort: 3000 
        - name: metric-port
          containerPort: 9464
        resources: {}